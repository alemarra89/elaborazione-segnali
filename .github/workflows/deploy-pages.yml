name: Aggiorna domande e pubblica PWA
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
      timezone: Europe/Rome
    # Recovery runs avoid relying on a single trigger at the busiest minute.
    # They stop before importing/building if today's quiz is already online.
    - cron: '17 11-23 * * *'
      timezone: Europe/Rome

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubblicazione-pwa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla se il quiz di oggi è già pubblicato
        id: check
        run: node scripts/should-update.mjs
  build:
    needs: check
    if: needs.check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica la logica
        run: npm test
      - name: Leggi le domande dal foglio privato
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync
      - name: Genera il quiz giornaliero
        run: npm run daily
      - name: Conserva domande e archivio giornaliero
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions.json data/daily.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna domande e quiz giornaliero [skip ci]'
            git push
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepara la PWA e controlla le risorse pubblicate
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
